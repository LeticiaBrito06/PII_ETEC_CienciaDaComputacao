spring.application.name=labquest-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/etec_game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

labquest.jwt.secret=${JWT_SECRET:LabQuestJwtSecretKeyLabQuestJwtSecretKey123456}
labquest.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
labquest.upload-dir=${UPLOAD_DIR:uploads}
labquest.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
